name: Daily Weather Automation

# Triggers the workflow automatically every morning, and allows manual triggers
on:
  schedule:
    # Runs every day at 11:00 AM UTC (adjust as needed for your local timezone)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows you to manually trigger the run from the GitHub website anytime

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository code onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment on the virtual machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install required dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      # Step 4: Execute the Python script, injecting the secret webhook URL from GitHub Secrets
      - name: Run Weather Automation Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py