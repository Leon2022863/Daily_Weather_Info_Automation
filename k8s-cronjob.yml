apiVersion: batch/v1
kind: CronJob
metadata:
  name: weather-automator
spec:
  # Runs every 3 hours
  schedule: "0 */3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: weather-automator
            image: weather-automator:latest
            imagePullPolicy: IfNotPresent  # Use 'Never' if testing locally in Minikube
            env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: weather-automator-secret
                  key: DISCORD_WEBHOOK_URL
          restartPolicy: OnFailure